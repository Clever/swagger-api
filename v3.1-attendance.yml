basePath: /v3.1
definitions:
  Attendance:
    properties:
      attendance_date:
        format: date
        type: string
      attendance_status:
        $ref: '#/definitions/AttendanceStatus'
      attendance_type:
        $ref: '#/definitions/AttendanceType'
      created:
        format: datetime
        type: string
      district_id:
        format: mongo-id
        type: string
      excuse_code:
        type: string
      last_modified:
        format: datetime
        type: string
      school_id:
        format: mongo-id
        type: string
      section_id:
        format: mongo-id
        type: string
      sis_id:
        type: string
      student_id:
        format: mongo-id
        type: string
    type: object
  AttendanceResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/Attendance'
        type: array
      links:
        items:
          $ref: '#/definitions/Link'
        type: array
        x-omitempty: true
    type: object
  AttendanceStatus:
    enum:
    - present
    - absent
    - tardy
    type: string
  AttendanceType:
    enum:
    - daily
    - section
    type: string
  BadRequest:
    properties:
      message:
        type: string
    type: object
  InternalError:
    properties:
      message:
        type: string
    type: object
  NotFound:
    properties:
      message:
        type: string
    type: object
host: api.clever.com
info:
  description: The Clever Attendance API
  title: Attendance API
  version: 3.1.0
paths:
  /attendance/schools/{school_id}:
    get:
      operationId: listAttendanceForSchool
      parameters:
      - in: path
        name: school_id
        required: true
        type: string
      - format: date
        in: query
        name: date_range_start
        type: string
      - format: date
        in: query
        name: date_range_end
        type: string
      - enum:
        - present
        - absent
        - tardy
        in: query
        name: attendance_status
        type: string
      - in: query
        maximum: 1000
        minimum: 1
        name: limit
        type: integer
      - in: query
        name: starting_after
        type: string
      - in: query
        name: ending_before
        type: string
      responses:
        "200":
          description: OK Response
          schema:
            $ref: '#/definitions/AttendanceResponse'
        "400":
          $ref: '#/responses/BadRequest'
        "401":
          $ref: '#/responses/Unauthorized'
        "404":
          $ref: '#/responses/NotFound'
        "500":
          $ref: '#/responses/InternalError'
      summary: Returns a list of attendance records for a school
  /attendance/sections/{section_id}:
    get:
      operationId: listAttendanceForSection
      parameters:
      - in: path
        name: section_id
        required: true
        type: string
      - format: date
        in: query
        name: date_range_start
        type: string
      - format: date
        in: query
        name: date_range_end
        type: string
      - enum:
        - present
        - absent
        - tardy
        in: query
        name: attendance_status
        type: string
      - in: query
        maximum: 1000
        minimum: 1
        name: limit
        type: integer
      - in: query
        name: starting_after
        type: string
      - in: query
        name: ending_before
        type: string
      responses:
        "200":
          description: OK Response
          schema:
            $ref: '#/definitions/AttendanceResponse'
        "400":
          $ref: '#/responses/BadRequest'
        "401":
          $ref: '#/responses/Unauthorized'
        "404":
          $ref: '#/responses/NotFound'
        "500":
          $ref: '#/responses/InternalError'
      summary: Returns a list of attendance records for a section
produces:
- application/json
responses:
  BadRequest:
    description: Bad Request
    schema:
      $ref: '#/definitions/BadRequest'
  InternalError:
    description: Internal Error
    schema:
      $ref: '#/definitions/InternalError'
  NotFound:
    description: Entity Not Found
    schema:
      $ref: '#/definitions/NotFound'
  Unauthorized:
    description: Not authorized
    schema:
      $ref: '#/definitions/Unauthorized'
schemes:
- https
security:
- bearerAuth: []
securityDefinitions:
  bearerAuth:
    description: |
      Provide a bearer token in the Authorization header, e.g.
      `Authorization: Bearer <token>`. Obtain one via the `oauth` or
      `oauthDistrict` flows below or via the Clever UI.
    in: header
    name: Authorization
    type: apiKey
  oauth:
    authorizationUrl: https://clever.com/oauth/authorize
    description: |
      Redirect the user to authorizationUrl, then exchange the returned
      code at tokenUrl (via HTTP Basic Auth with your client ID/secret)
      for an access token. Issues an SSO bearer token, scoped to the
      signed-in user. Does not provide full Data API/roster access.
    flow: accessCode
    tokenUrl: https://clever.com/oauth/tokens
    type: oauth2
  oauthDistrict:
    description: |
      Authenticate directly against tokenUrl via HTTP Basic Auth with
      your app's client ID/secret to get an access token. Add a
      `district=<id>` query param to scope the token to that district.
      Issues a district-app token in access_code field, scoped to that district's shared data.
    flow: application
    tokenUrl: https://clever.com/oauth/tokens
    type: oauth2
swagger: "2.0"
x-samples-languages:
- curl
- node
- ruby
- python
- php
- java
- go
